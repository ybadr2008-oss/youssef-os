<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Youssef World | AI & Cybersecurity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #020617;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* خلفية نيون مدمجة (أزرق نيون + بنفسجي سايبر) */
    body::before {
      content: '';
      position: absolute;
      width: 750px; height: 750px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.12) 0%, rgba(0, 242, 254, 0.06) 60%, transparent 100%);
      filter: blur(150px);
      border-radius: 50%;
      z-index: 0;
      top: 5%;
    }

    /* البار العلوي الفاجر */
    .top-bar {
      width: 100%;
      padding: 20px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 2px solid rgba(139, 92, 246, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 50;
      box-shadow: 0 5px 30px rgba(139, 92, 246, 0.25);
      backdrop-filter: blur(15px);
    }

    .top-bar h2 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, #00f2fe, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.5));
    }

    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1100px;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }

    /* شبكة الكروت */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      width: 100%;
      max-width: 900px;
    }

    /* تصميم الكارت بلون مميز وانعكاس فاجر */
    .cyber-card {
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.95), rgba(9, 14, 28, 0.98));
      border: 2px solid rgba(0, 242, 254, 0.3);
      border-radius: 24px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 20px rgba(0, 242, 254, 0.04);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.35s ease, border-color 0.35s ease;
      backdrop-filter: blur(12px);
      min-height: 230px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .cyber-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.3), transparent);
      transition: 0.6s;
    }

    .cyber-card:active::before, .cyber-card:hover::before {
      left: 100%;
    }

    .cyber-card i {
      font-size: 3.2rem;
      color: #00f2fe;
      margin-bottom: 15px;
      display: block;
      text-shadow: 0 0 20px rgba(0, 242, 254, 0.7);
      transition: transform 0.3s ease;
    }

    .cyber-card h3 {
      font-size: 1.5rem;
      color: #fff;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .cyber-card p {
      font-size: 0.88rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .cyber-card:hover, .cyber-card:active {
      border-color: #8b5cf6;
      box-shadow: -10px 10px 40px rgba(139, 92, 246, 0.4), inset 0 0 25px rgba(0, 242, 254, 0.15);
      transform: translateY(-8px) scale(1.04);
    }

    .cyber-card:hover i {
      transform: scale(1.15) translateY(-3px);
      color: #8b5cf6;
      text-shadow: 0 0 25px rgba(139, 92, 246, 0.9);
    }

    /* نافذة المودال المكبرة بالطول مع ستايل خلفية سينمائي فاجر */
    .modal {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.85);
      width: 92vw; max-width: 520px;
      min-height: 380px; /* مكبرة بالطول كطلبك */
      background: linear-gradient(160deg, rgba(6, 11, 24, 0.98), rgba(15, 23, 42, 0.99));
      border: 2px solid #00f2fe;
      border-radius: 24px; padding: 30px;
      z-index: 100; display: none; opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 70px rgba(0, 242, 254, 0.4), inset 0 0 30px rgba(139, 92, 246, 0.1);
    }
    .modal.active { display: flex; flex-direction: column; opacity: 1; transform: translate(-50%, -50%) scale(1); }
    
    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(0,242,254,0.3); padding-bottom: 15px; margin-bottom: 20px; }
    .modal-title { font-size: 1.35rem; color: #00f2fe; font-weight: 900; font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px rgba(0,242,254,0.5); }
    
    .close-modal { background: #ef4444; color: white; border: none; padding: 6px 14px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
    .close-modal:hover { background: #f87171; transform: scale(1.05); }

    /* خلفية الكلام اللي بيتكتب وتأثير الكتابة السينمائية */
    .modal-body { 
      color: #f1f5f9; 
      font-size: 1.05rem; 
      line-height: 1.9; 
      flex-grow: 1;
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 14px;
      padding: 20px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
      white-space: pre-line;
      position: relative;
    }

    /* مؤشر الكتابة (Cursor) النيون */
    .typing-cursor::after {
      content: '|';
      color: #00f2fe;
      animation: blink 0.8s infinite;
      font-weight: bold;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (max-width: 600px) {
      .cards-grid { grid-template-columns: 1fr; gap: 20px; max-width: 400px; }
      .top-bar h2 { font-size: 1.1rem; }
      .cyber-card { min-height: 180px; padding: 30px 15px; }
      .modal { min-height: 340px; padding: 20px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>Welcome To Youssef World</h2>
  </div>

  <div class="container">
    <div class="cards-grid">
      <div class="cyber-card" onclick="openModal('projects', '📂 قسم المشاريع:\n\n• AI & Machine Learning: تطوير نماذج ذكاء اصطناعي وتحليل البيانات الضخمة بدقة فائقة.\n\n• Cybersecurity Tools: بناء سكريبتات حماية متقدمة وأدوات لاختبار الاختراق الآمن.\n\n• Interactive 3D Web: تصميم وتطوير واجهات مستخدم تفاعلية وعصرية.')">
        <i class="fas fa-code"></i>
        <h3>المشاريع</h3>
        <p>استكشف ابتكارات وأعمال البرمجة والذكاء الاصطناعي</p>
      </div>

      <div class="cyber-card" onclick="openModal('skills', '⚡ المهارات والتقنيات:\n\n• لغات البرمجة: Python, C++, JavaScript, HTML/CSS\n\n• الأمن السيبراني: Ethical Hacking, Linux, Metasploit, Network Security\n\n• الذكاء الاصطناعي: Machine Learning & Deep Learning Fundamentals')">
        <i class="fas fa-bolt"></i>
        <h3>المهارات</h3>
        <p>تقنيات متقدمة في الأمن السيبراني ولغات البرمجة</p>
      </div>

      <div class="cyber-card" onclick="openModal('about', '🛡️ عنّي:\n\nأهلاً بك في عالمي الرقمي! أنا يوسف، طالب علوم حاسب، شغوف جداً بعالم الذكاء الاصطناعي والأمن السيبراني.\n\nأسعى دائماً لابتكار حلول برمجية آمنة وتطوير أنظمة رقمية تتسم بالكفاءة والذكاء.')">
        <i class="fas fa-user-shield"></i>
        <h3>عنّي</h3>
        <p>شغف بالتكنولوجيا وعالم الأنظمة الرقمية الحديثة</p>
      </div>

      <div class="cyber-card" onclick="openModal('contact', '📬 التواصل والمجال:\n\n• التخصص الأساسي: Computer Science & Cybersecurity\n\n• الموقع الجغرافي: مصر (الشرقية - كفر صقر)\n\n• تواصل معي عبر قنوات المنصات الرقمية لبدء مشاريع مستقبلية مشتركة!')">
        <i class="fas fa-envelope"></i>
        <h3>التواصل</h3>
        <p>تواصل معي واعرف المزيد عن أعمالي ومجالي</p>
      </div>
    </div>
  </div>

  <div id="dynamicModal" class="modal">
    <div class="modal-header">
      <h3 id="modalTitle" class="modal-title">العنوان</h3>
      <button class="close-modal" onclick="closeModal()">✖ إغلاق</button>
    </div>
    <div id="modalTextBody" class="modal-body typing-cursor"></div>
  </div>

  <script>
    let typingInterval;

    function openModal(type, textContent) {
      const modal = document.getElementById('dynamicModal');
      const textBody = document.getElementById('modalTextBody');
      const titleElement = document.getElementById('modalTitle');
      
      // تعيين العنوان حسب الكارت
      if(type === 'projects') titleElement.innerText = "📂 المشاريع";
      if(type === 'skills') titleElement.innerText = "⚡ المهارات";
      if(type === 'about') titleElement.innerText = "🛡️ عنّي";
      if(type === 'contact') titleElement.innerText = "📬 التواصل";

      modal.classList.add('active');
      textBody.innerText = ""; // تفريغ النص القديم
      
      let i = 0;
      clearInterval(typingInterval);
      
      // تأثير الكتابة الحرفية السينمائية
      typingInterval = setInterval(() => {
        if (i < textContent.length) {
          textBody.innerText += textContent.charAt(i);
          i++;
        } else {
          clearInterval(typingInterval);
        }
      }, 20); // سرعة الكتابة بالحرف الواحد
    }

    function closeModal() {
      clearInterval(typingInterval);
      document.getElementById('dynamicModal').classList.remove('active');
    }
  </script>
</body>
</html>
