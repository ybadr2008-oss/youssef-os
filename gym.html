<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جيم نزاهة - Membership Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #121212; color: #f8f9fa; font-family: Tahoma, sans-serif; }
    .card { background-color: #1e1e1e; border: 1px solid #333; }
    .form-control, .form-select { background-color: #2a2a2a; color: #fff; border: 1px solid #444; }
    .form-control:focus, .form-select:focus { background-color: #2a2a2a; color: #fff; border-color: #0d6efd; box-shadow: none; }
    .nav-pills .nav-link.active { background-color: #0d6efd; }
    .nav-pills .nav-link { color: #aaa; }
  </style>
</head>
<body class="py-5">

  <div class="container" style="max-width: 700px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>🔥 جيم نزاهة - بوابة الاشتراكات</h2>
      <button class="btn btn-outline-warning btn-sm" onclick="toggleCaptainDashboard()">👑 لوحة تحكم الكابتن</button>
    </div>

    <!-- لوحة تحكم الكابتن المعلقة -->
    <div id="captainDashboard" class="card p-4 mb-4" style="display: none; border-color: #ffc107;">
      <h4 class="text-warning mb-3">🛠️ طلبات الأعضاء بانتظار الموافقة</h4>
      <div id="pendingRequestsList">
        <p class="text-muted">جاري التحميل...</p>
      </div>
    </div>

    <!-- التبديل بين مشترك جديد أو تجديد -->
    <ul class="nav nav-pills mb-4 justify-content-center bg-dark p-2 rounded border border-secondary" id="portalTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active fw-bold" id="new-tab" data-bs-toggle="pill" data-bs-target="#newContent" type="button">✨ مشترك جديد</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link fw-bold" id="renew-tab" data-bs-toggle="pill" data-bs-target="#renewContent" type="button">🔄 تجديد اشتراك</button>
      </li>
    </ul>

    <div class="tab-content" id="portalTabContent">
      
      <!-- قسم مشترك جديد -->
      <div class="tab-pane fade show active" id="newContent">
        <div class="card p-4 shadow-lg">
          <h3 class="mb-3 text-primary">تسجيل مشترك جديد</h3>
          <form id="newMemberForm" onsubmit="handleNewRegistration(event)">
            <div class="mb-3">
              <label class="form-label">الاسم الكامل</label>
              <input type="text" id="newName" class="form-control" required placeholder="اكتب اسمك الثلاثي">
            </div>
            <div class="mb-3">
              <label class="form-label">رقم الموبايل</label>
              <input type="tel" id="newPhone" class="form-control" required placeholder="010xxxxxxxx">
            </div>
            <div class="mb-3">
              <label class="form-label">البلد / المنطقة</label>
              <input type="text" id="newCountry" class="form-control" placeholder="مثال: كفر صقر، الزقازيق..." required>
            </div>
            <div class="mb-3">
              <label class="form-label">اختر الباقة</label>
              <select id="newPlanSelect" class="form-select" onchange="selectedNewPlanName = this.value">
                <option value="باقة شهرية - 800 جنيه">باقة شهرية - 800 جنيه</option>
                <option value="باقة VIP - 1500 جنيه">باقة VIP - 1500 جنيه</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">تاريخ البدء</label>
              <input type="date" id="newStartDate" class="form-control" required>
            </div>
            <div class="mb-3">
              <label class="form-label">صورة إيصال التحويل</label>
              <input type="file" id="newReceipt" class="form-control" accept="image/*" required>
              <small class="text-muted">برجاء رفع إيصال فودافون كاش أو التحويل الصحيح.</small>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">إرسال طلب الاشتراك لكابتن نزاهة</button>
          </form>
        </div>
      </div>

      <!-- قسم تجديد الاشتراك -->
      <div class="tab-pane fade" id="renewContent">
        <div class="card p-4 shadow-lg">
          <h3 class="mb-3 text-success">تجديد اشتراك حالي</h3>
          <div class="mb-3">
            <label class="form-label">أدخل رقم الموبايل المسجل به مسبقاً</label>
            <div class="input-group">
              <input type="tel" id="renewPhoneInput" class="form-control" placeholder="010xxxxxxxx">
              <button class="btn btn-outline-success" type="button" onclick="lookupMember()">بحث عن الحساب</button>
            </div>
          </div>

          <!-- تفاصيل العضو بعد البحث -->
          <div id="renewDetailsCard" style="display: none;" class="mt-4 p-3 border border-secondary rounded bg-black">
            <div id="memberFoundInfo" class="mb-3 text-info"></div>
            
            <hr class="border-secondary">
            
            <div class="mb-3">
              <label class="form-label">تعديل الاسم (اختياري)</label>
              <input type="text" id="renewEditName" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">تعديل رقم الموبايل</label>
              <input type="tel" id="renewEditPhone" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">البلد / المنطقة</label>
              <input type="text" id="renewEditCountry" class="form-control" placeholder="كفر صقر، الزقازيق...">
            </div>
            <div class="mb-3">
              <label class="form-label">اختر الباقة الجديدة</label>
              <select id="renewPlanSelect" class="form-select" onchange="selectedRenewPlanName = this.value">
                <option value="باقة شهرية - 800 جنيه">باقة شهرية - 800 جنيه</option>
                <option value="باقة VIP - 1500 جنيه">باقة VIP - 1500 جنيه</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">تاريخ بدء التجديد</label>
              <input type="date" id="renewStartDate" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">صورة إيصال التجديد الجديد</label>
              <input type="file" id="renewReceipt" class="form-control" accept="image/*" required>
            </div>
            <button type="button" class="btn btn-success w-100 fw-bold py-2" onclick="handleRenewalSubmit()">إرسال طلب التجديد لكابتن نزاهة</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- مودال النجاح -->
  <div class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white border-secondary">
        <div class="modal-header border-secondary">
          <h5 class="modal-title" id="successModalTitle">رسالة النظام</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="successModalBody"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // رابط SheetDB الخاص بك
    const SHEET_API_URL = "https://sheetdb.io/api/v1/8mdd58x2eu9w7"; 
    let selectedNewPlanName = "باقة شهرية - 800 جنيه";
    let selectedRenewPlanName = "باقة شهرية - 800 جنيه";
    let currentFoundMember = null;

    // ضبط التواريخ تلقائياً عند الفتح
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      if(document.getElementById('newStartDate')) document.getElementById('newStartDate').value = today;
      if(document.getElementById('renewStartDate')) document.getElementById('renewStartDate').value = today;
      renderPendingRequests();
    });

    // دالة لحساب تاريخ الانتهاء (تاريخ البدء + 30 يوم)
    function calculateExpiryDate(startDateStr) {
      const date = new Date(startDateStr);
      if (isNaN(date.getTime())) return '';
      date.setDate(date.getDate() + 30);
      return date.toISOString().split('T')[0];
    }

    // 1. معالجة مشترك جديد (إرسال الطلب للمعلقين)
    function handleNewRegistration(event) {
      event.preventDefault();
      const name = document.getElementById('newName').value.trim();
      const phone = document.getElementById('newPhone').value.trim();
      const country = document.getElementById('newCountry').value.trim();
      const startDateVal = document.getElementById('newStartDate').value;
      const receiptFile = document.getElementById('newReceipt').files[0];

      if (!receiptFile) {
        alert("برجاء رفع صورة إيصال التحويل!");
        return;
      }

      const expiryStr = calculateExpiryDate(startDateVal);

      const newReq = {
        id: Date.now(),
        type: 'اشتراك جديد',
        name,
        phone,
        country,
        plan: selectedNewPlanName,
        start_date: startDateVal,
        expiry: expiryStr
      };

      savePendingRequest(newReq);

      showSuccessModal(
        "تم إرسال طلبك بنجاح! ⏳",
        `يا بطل <b>${name}</b> من (${country})، تم إرسال طلبك لكابتن نزاهة للمراجعة والتفعيل الفوري فور مطابقة الإيصال.`
      );

      triggerApprovalWhatsApp(name, phone, country, selectedNewPlanName, 'اشتراك جديد', startDateVal, expiryStr);
      document.getElementById('newMemberForm').reset();
      renderPendingRequests();
    }

    // 2. البحث عن المشترك للتجديد
    async function lookupMember() {
      const phoneInput = document.getElementById('renewPhoneInput').value.trim();
      if (!phoneInput) {
        alert("برجاء إدخال رقم الموبايل أولاً!");
        return;
      }

      try {
        const response = await fetch(SHEET_API_URL);
        if (!response.ok) throw new Error("فشل الاتصال");
        const data = await response.json();
        
        const membersList = Array.isArray(data) ? data : (data.data || data.records || []);
        const cleanInput = phoneInput.replace(/[^0-9]/g, '');

        const member = membersList.find(m => {
          const sheetPhone = String(m.phone || m.Phone || '').replace(/[^0-9]/g, '');
          return sheetPhone === cleanInput || sheetPhone.endsWith(cleanInput);
        });

        if (member) {
          currentFoundMember = member;
          const memberName = member.name || member.Name || 'غير معروف';
          const memberPhone = member.phone || member.Phone || phoneInput;
          const memberCountry = member.country || member.Country || '';
          const memberPlan = member.plan || member.Plan || 'غير محدد';
          
          let memberExpiry = member.expiry || member.Expiry;
          const startDate = member.start_date || member.Start_date || member.startDate;
          if ((!memberExpiry || memberExpiry.trim() === '') && startDate) {
            memberExpiry = calculateExpiryDate(startDate);
          }
          memberExpiry = memberExpiry || 'غير محدد';

          let expiryStatus = `<span style="color:#38a169; font-weight:900;">ساري حتى: ${memberExpiry}</span>`;
          if (memberExpiry !== 'غير محدد') {
            const today = new Date().toISOString().split('T')[0];
            if (memberExpiry < today) {
              expiryStatus = `<span style="color:#e53e3e; font-weight:900;">منتهي (تاريخ الانتهاء: ${memberExpiry}) - يلا جدد يا بطل!</span>`;
            }
          }

          document.getElementById('memberFoundInfo').innerHTML = `
            ✅ تم العثور على حسابك بنجاح!<br>
            👤 الاسم المسجل: <b>${memberName}</b><br>
            🌍 البلد: <b>${memberCountry || 'غير مسجل'}</b><br>
            📱 رقم الموبايل: <b>${memberPhone}</b><br>
            🎟️ باقتك السابقة: <b>${memberPlan}</b><br>
            📅 حالة الاشتراك: ${expiryStatus}
          `;
          document.getElementById('renewEditName').value = memberName;
          document.getElementById('renewEditPhone').value = memberPhone;
          document.getElementById('renewEditCountry').value = memberCountry;
          document.getElementById('renewDetailsCard').style.display = 'block';
        } else {
          alert("الرقم غير مسجل في جدول البيانات. تأكد من الرقم أو سجل كـ (مشترك جديد).");
        }
      } catch (error) {
        console.error(error);
        alert("حدث خطأ أثناء البحث في قاعدة البيانات.");
      }
    }

    // 3. معالجة طلب التجديد
    function handleRenewalSubmit() {
      if (!currentFoundMember) return;

      const editName = document.getElementById('renewEditName').value.trim();
      const editPhone = document.getElementById('renewEditPhone').value.trim();
      const editCountry = document.getElementById('renewEditCountry').value.trim();
      const startDateVal = document.getElementById('renewStartDate').value;
      const receiptFile = document.getElementById('renewReceipt').files[0];

      if (!receiptFile) {
        alert("برجاء رفع صورة إيصال التجديد!");
        return;
      }

      const expiryStr = calculateExpiryDate(startDateVal);

      const renewReq = {
        id: Date.now(),
        type: 'تجديد اشتراك',
        name: editName,
        phone: editPhone,
        country: editCountry,
        plan: selectedRenewPlanName,
        start_date: startDateVal,
        expiry: expiryStr,
        oldPhone: currentFoundMember.phone // عشان لو حابب نحدثه مكان القديم
      };

      savePendingRequest(renewReq);

      showSuccessModal(
        "تم إرسال طلب التجديد بنجاح! ⏳",
        `يا بطل <b>${editName}</b>، تم إرسال طلب تجديد باقتك لكابتن نزاهة للمراجعة والتفعيل.`
      );

      triggerApprovalWhatsApp(editName, editPhone, editCountry, selectedRenewPlanName, 'تجديد اشتراك', startDateVal, expiryStr);

      document.getElementById('renewDetailsCard').style.display = 'none';
      document.getElementById('renewPhoneInput').value = '';
      renderPendingRequests();
    }

    // إرسال واتساب للكابتن
    function triggerApprovalWhatsApp(name, phone, country, plan, type, startDate, expiry) {
      const captainPhone = "201017995678";
      const message = `🚨 طلب ${type} جديد بحاجة للمراجعة - جيم نزاهة\n\n` +
                      `👤 الاسم: ${name}\n` +
                      `🌍 البلد: ${country}\n` +
                      `📱 الموبايل: ${phone}\n` +
                      `🎟️ الباقة: ${plan}\n` +
                      `📅 البدء: ${startDate} | الانتهاء: ${expiry}\n\n` +
                      `⚠️ [يرجى فتح لوحة تحكم الموقع والضغط على زر (قبول) لترحيل وتحديث البيانات لجوجل شيت أوتوماتيكياً].`;
      
      const encodedMsg = encodeURIComponent(message);
      window.open(`https://wa.me/${captainPhone}?text=${encodedMsg}`, '_blank');
    }

    // إدارة الطلبات المعلقة محلياً
    function savePendingRequest(reqData) {
      let pending = JSON.parse(localStorage.getItem('gym_pending_requests') || '[]');
      pending.push(reqData);
      localStorage.setItem('gym_pending_requests', JSON.stringify(pending));
    }

    function toggleCaptainDashboard() {
      const dash = document.getElementById('captainDashboard');
      dash.style.display = (dash.style.display === 'none') ? 'block' : 'none';
      if (dash.style.display === 'block') renderPendingRequests();
    }

    function renderPendingRequests() {
      const container = document.getElementById('pendingRequestsList');
      const pending = JSON.parse(localStorage.getItem('gym_pending_requests') || '[]');

      if (pending.length === 0) {
        container.innerHTML = `<p class="text-muted">لا توجد طلبات معلقة حالياً.</p>`;
        return;
      }

      let html = '';
      pending.forEach((req, index) => {
        html += `
          <div class="p-3 mb-3 border border-secondary rounded bg-black">
            <p class="m-1"><b>النوع:</b> <span class="text-warning">${req.type}</span> | <b>الاسم:</b> ${req.name} | <b>البلد:</b> ${req.country}</p>
            <p class="m-1"><b>الموبايل:</b> ${req.phone} | <b>الباقة:</b> ${req.plan}</p>
            <p class="m-1"><b>الفترة:</b> من ${req.start_date} إلى ${req.expiry}</p>
            <div class="mt-2">
              <button class="btn btn-success btn-sm me-2" onclick="approveRequest(${index})">✅ قبول وتحديث الشيت أوتوماتيكياً</button>
              <button class="btn btn-danger btn-sm" onclick="rejectRequest(${index})">❌ رفض الطلب</button>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // قبول الطلب وفعلياً ترحيله لجوجل شيت أوتوماتيك
    async function approveRequest(index) {
      let pending = JSON.parse(localStorage.getItem('gym_pending_requests') || '[]');
      const req = pending[index];

      const payload = {
        data: [{
          name: req.name,
          phone: req.phone,
          country: req.country,
          plan: req.plan,
          start_date: req.start_date,
          expiry: req.expiry
        }]
      };

      try {
        // لو تجديد، ممكن نحذف القديم أو نضيف الجديد حسب الرغبة، هنا بنضيفه مباشر للشيت
        const response = await fetch(SHEET_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert("تم قبول الطلب وترحيل البيانات بنجاح إلى جوجل شيت! 💪");
          pending.splice(index, 1);
          localStorage.setItem('gym_pending_requests', JSON.stringify(pending));
          renderPendingRequests();
        } else {
          alert("حدث خطأ أثناء إرسال البيانات لجوجل شيت.");
        }
      } catch (err) {
        console.error(err);
        alert("خطأ في الاتصال بالشبكة.");
      }
    }

    // رفض الطلب مع إرسال السبب للعميل عبر الواتساب
    function rejectRequest(index) {
      const reason = prompt("اكتب سبب الرفض لإرساله للعميل عبر الواتساب:", "صورة الإيصال غير واضحة أو غير مطابقة للمبلغ");
      if (reason === null) return;

      let pending = JSON.parse(localStorage.getItem('gym_pending_requests') || '[]');
      const req = pending[index];

      const clientMsg = `عذراً يا ${req.name}، تم رفض طلب اشتراكك في جيم نزاهة للأسباب الآتية: ${reason}. برجاء التواصل أو المحاولة مرة أخرى.`;
      window.open(`https://wa.me/${req.phone}?text=${encodeURIComponent(clientMsg)}`, '_blank');

      pending.splice(index, 1);
      localStorage.setItem('gym_pending_requests', JSON.stringify(pending));
      renderPendingRequests();
      alert("تم رفض الطلب بنجاح.");
    }

    function showSuccessModal(title, body) {
      document.getElementById('successModalTitle').innerText = title;
      document.getElementById('successModalBody').innerHTML = body;
      new bootstrap.Modal(document.getElementById('successModal')).show();
    }
  </script>
</body>
</html>
